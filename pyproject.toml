[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tex2docx"
version = "0.1.0"
description = "XeLaTeX (polyglossia / reledmac / biblatex) to reviewable Word .docx batch converter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hiroaki Sawa" }]
dependencies = [
    "lxml>=4.9",
    "PyYAML>=6.0",
    "pypdfium2>=4.20",
    "fonttools>=4.40",
    "python-docx>=1.0",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tex2docx = "tex2docx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tex2docx = ["data/*", "filters/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
